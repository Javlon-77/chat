<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suhbat — sun'iy intellekt bilan gaplashing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0f3; --panel:#f8fafb; --ink:#13263a; --muted:#5d7083; --line:#d3dde4;
  --me:#1d4e89; --me-ink:#fff; --ai:#ffffff; --accent:#0d7c86; --code:#102a43; --code-ink:#e6eef5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1a26; --panel:#14222f; --ink:#e4edf3; --muted:#8ba0b3; --line:#243646;
  --me:#3a78c2; --ai:#182a3a; --accent:#3fc1c9; --code:#0a141d; --code-ink:#dbe7f0}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Onest,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;background:var(--panel);
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
header h1{font-size:1.05rem;margin:0;font-weight:700;flex:1}
header small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:8px 12px;border-radius:10px}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:86%;padding:11px 15px;border-radius:16px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--ai);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg pre{background:var(--code);color:var(--code-ink);padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0;white-space:pre}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.msg :not(pre)>code{background:rgba(127,150,170,.2);padding:1px 5px;border-radius:5px}
.msg.err{border-color:#c0392b;color:#c0392b}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:420px}
.empty h2{color:var(--ink);font-size:1.5rem;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.typing{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.typing{animation:none}}
form{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--ai);border:1px solid var(--line);
  border-radius:12px;padding:11px 14px;max-height:160px;line-height:1.5}
#send{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:0 20px}
#send:disabled{opacity:.5;cursor:default}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-width:420px;width:92%}
dialog::backdrop{background:rgba(10,20,30,.5)}
dialog label{display:block;margin:12px 0 4px;font-size:.88rem;color:var(--muted)}
dialog input{width:100%;font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--ai);color:var(--ink)}
dialog p{font-size:.85rem;color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Suhbat<small>Sun'iy intellekt yordamchisi</small></h1>
    <button id="settingsBtn" type="button">Sozlamalar</button>
    <button id="newBtn" type="button">Yangi suhbat</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Savolingizni yozing…" aria-label="Xabar"></textarea>
    <button id="send" type="submit">Yuborish</button>
  </form>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">Sozlamalar</h3>
  <label for="apiUrl">Server manzili (proxy)</label>
  <input id="apiUrl" placeholder="https://nom.sizning.workers.dev">
  <label for="apiKey">Yoki o'z xAI kalitingiz (faqat sinov uchun)</label>
  <input id="apiKey" type="password" placeholder="xai-…" autocomplete="off">
  <p>Kalit faqat shu brauzerda saqlanadi. Hammaga ochiq sayt uchun kalitni sahifaga emas, serverga (worker.js) qo'ying.</p>
  <div class="row"><button type="button" id="cancel">Bekor qilish</button><button type="button" id="save">Saqlash</button></div>
</dialog>

<script>
/* ====== SOZLAMA: worker manzilingizni shu yerga yozing ====== */
const DEFAULT_API_URL = "";           // masalan: "https://suhbat.ismingiz.workers.dev"
const DIRECT_MODEL = "grok-4";        // faqat to'g'ridan-to'g'ri (o'z kalit) rejimi uchun
/* ============================================================ */

const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send");
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
let history = store.get("chat", []);
let busy = false;

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(text){
  const parts = text.split(/```/);
  return parts.map((p, i) => {
    if (i % 2) return "<pre><code>" + esc(p.replace(/^[\w+-]*\n/, "")) + "</code></pre>";
    return esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  }).join("");
}
function addMsg(role, text){
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = render(text);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function showEmpty(){
  log.innerHTML = `<div class="empty"><h2>Salom! Nima haqida gaplashamiz?</h2>
  <div>Savol bering, matn yozdiring yoki kod bo'yicha yordam so'rang.</div>
  <div class="chips">
    <button type="button" data-q="Menga o'zbek tilida qisqa hikoya yozib ber">Hikoya yozish</button>
    <button type="button" data-q="Python'da faylni qanday o'qiladi?">Dasturlash</button>
    <button type="button" data-q="Inglizcha xat yozishga yordam ber">Xat yozish</button>
  </div></div>`;
}
function restore(){
  log.innerHTML = "";
  if (!history.length) return showEmpty();
  history.forEach(m => addMsg(m.role === "user" ? "user" : "ai", m.content));
}

async function ask(){
  const apiUrl = store.get("apiUrl", DEFAULT_API_URL), key = store.get("apiKey", "");
  const msgs = history.slice(-30);
  let url, headers = {"Content-Type":"application/json"}, body;
  if (apiUrl){
    url = apiUrl; body = {messages: msgs};
  } else if (key){
    url = "https://api.x.ai/v1/chat/completions";
    headers.Authorization = "Bearer " + key;
    body = {model: DIRECT_MODEL, stream: true, messages: [{role:"system", content:"Siz foydali yordamchisiz. Foydalanuvchi qaysi tilda yozsa, shu tilda javob bering."}, ...msgs]};
  } else {
    throw new Error("Server manzili yoki kalit kiritilmagan. «Sozlamalar»ni oching.");
  }
  const res = await fetch(url, {method:"POST", headers, body: JSON.stringify(body)});
  if (!res.ok) throw new Error("Server xatosi (" + res.status + "). " + (await res.text()).slice(0, 200));
  return res;
}

async function send(text){
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  if (!history.length) log.innerHTML = "";
  history.push({role:"user", content:text});
  addMsg("user", text);
  const bubble = addMsg("ai", ""); bubble.innerHTML = '<span class="typing"></span>';
  let full = "";
  try{
    const res = await ask();
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for(;;){
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const l of lines){
        if (!l.startsWith("data:")) continue;
        const data = l.slice(5).trim(); if (data === "[DONE]") continue;
        try{ full += JSON.parse(data).choices?.[0]?.delta?.content || ""; }catch{}
        bubble.innerHTML = render(full); log.scrollTop = log.scrollHeight;
      }
    }
    if (!full) throw new Error("Bo'sh javob keldi. Qayta urinib ko'ring.");
    history.push({role:"assistant", content:full}); store.set("chat", history);
  }catch(e){
    bubble.className = "msg ai err"; bubble.textContent = e.message;
    history.pop(); store.set("chat", history);
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

$("form").addEventListener("submit", e => { e.preventDefault(); const t = input.value; input.value = ""; input.style.height = "auto"; send(t); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("form").requestSubmit(); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
log.addEventListener("click", e => { const q = e.target.dataset?.q; if (q) send(q); });
$("newBtn").onclick = () => { if (busy) return; history = []; store.set("chat", []); showEmpty(); };
$("settingsBtn").onclick = () => { $("apiUrl").value = store.get("apiUrl", DEFAULT_API_URL); $("apiKey").value = store.get("apiKey", ""); $("dlg").showModal(); };
$("cancel").onclick = () => $("dlg").close();
$("save").onclick = () => { store.set("apiUrl", $("apiUrl").value.trim()); store.set("apiKey", $("apiKey").value.trim()); $("dlg").close(); };
restore();
</script>
</body>
</html>
