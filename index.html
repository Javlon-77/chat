
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1120;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center}
.chat{width:100%;max-width:750px;height:95vh;max-height:850px;background:#111827;border:1px solid #263247;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
header{padding:18px 22px;background:#172033;border-bottom:1px solid #263247;display:flex;align-items:center;gap:12px}
.logo{width:43px;height:43px;background:#6366f1;border-radius:14px;display:grid;place-items:center;font-size:22px}
header h2{margin:0;font-size:19px}
.status{color:#4ade80;font-size:12px;margin-top:5px}
#messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.welcome{text-align:center;margin:auto;color:#94a3b8;line-height:1.8}
.welcome .big{font-size:48px}
.message{max-width:80%;align-self:flex-start}
.message.mine{align-self:flex-end}
.name{font-size:12px;color:#a5b4fc;margin:0 0 6px 5px}
.bubble{padding:12px 15px;border-radius:15px;background:#263247;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5}
.mine .bubble{background:#4f46e5;border-bottom-right-radius:4px}
.message:not(.mine) .bubble{border-bottom-left-radius:4px}
.time{text-align:right;font-size:10px;color:#cbd5e1;margin-top:5px}
form{display:flex;gap:10px;padding:16px;border-top:1px solid #263247;background:#172033}
input{min-width:0;flex:1;padding:14px;border:1px solid #334155;border-radius:12px;background:#0b1120;color:white;outline:none;font-size:15px}
input:focus{border-color:#818cf8}
button{border:0;border-radius:12px;background:#6366f1;color:white;padding:0 20px;font-size:15px;font-weight:bold;cursor:pointer}
button:hover{background:#4f46e5}
.bottom{display:flex;justify-content:space-between;align-items:center;padding:0 17px 12px;background:#172033;color:#64748b;font-size:11px}
.clear{background:transparent;color:#94a3b8;padding:5px;font-size:12px}
@media(max-width:500px){.chat{height:100vh;max-height:none;border-radius:0;border:0}header{padding:15px}#messages{padding:15px}form{padding:12px}.message{max-width:90%}}
</style>
</head>
<body>
<div class="chat">
  <header>
    <div class="logo">💬</div>
    <div>
      <h2>Simple Chat</h2>
      <div class="status">● Chat tayyor</div>
    </div>
  </header>

  <main id="messages">
    <div class="welcome" id="welcome">
      <div class="big">💬</div>
      <h2>Chatga xush kelibsiz!</h2>
      <p>Pastdagi maydonga xabaringizni yozing.</p>
    </div>
  </main>

  <form id="chatForm">
    <input id="messageInput" placeholder="Xabar yozing..." autocomplete="off" maxlength="2000" required>
    <button type="submit">Yuborish ➤</button>
  </form>
  <div class="bottom">
    <span>Simple Chat</span>
    <button class="clear" id="clearBtn" type="button">🗑 Chatni tozalash</button>
  </div>
</div>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

let history = [];
try {
  history = JSON.parse(localStorage.getItem("simple-chat-messages") || "[]");
} catch {
  history = [];
}

function renderMessage(item) {
  const wrapper = document.createElement("div");
  wrapper.className = "message" + (item.mine ? " mine" : "");

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = item.mine ? "Siz" : item.name;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = item.text;

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = item.time;

  wrapper.append(name, bubble, time);
  messages.appendChild(wrapper);
}

function renderAll() {
  messages.replaceChildren();
  if (!history.length) {
    messages.appendChild(welcome);
    return;
  }
  history.forEach(renderMessage);
  messages.scrollTop = messages.scrollHeight;
}

function save() {
  localStorage.setItem("simple-chat-messages", JSON.stringify(history));
}

form.addEventListener("submit", function(event) {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  const item = {
    text,
    mine: true,
    time: new Date().toLocaleTimeString("uz-UZ", {
      hour: "2-digit",
      minute: "2-digit"
    })
  };

  history.push(item);
  save();
  renderAll();
  input.value = "";
  input.focus();
});

document.getElementById("clearBtn").addEventListener("click", function() {
  if (confirm("Chatdagi barcha xabarlarni o‘chirasizmi?")) {
    history = [];
    save();
    renderAll();
  }
});

renderAll();
</script>
</body>
</html>
